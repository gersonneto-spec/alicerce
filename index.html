    if (p.textContent) box.appendChild(p);
  });
  const palavras = (item.m || "").split(/\s+/).length;
  document.getElementById("tempoLeitura").textContent = Math.max(1, Math.round(palavras / 190)) + " min";

  const k = chave(d);
  const jaSalvo = salvos.some(s => s.k === k);
  const b = document.getElementById("btnSalvar");
  b.classList.toggle("ativo", jaSalvo);
  document.getElementById("btnSalvarTxt").textContent = jaSalvo ? "Salva" : "Salvar";

  document.getElementById("dataDia").textContent = String(d.getDate()).padStart(2,"0") + " " + MESES[d.getMonth()];
  const eHoje = k === chave(hoje());
  document.getElementById("dataSem").textContent = eHoje ? "Hoje · " + DIAS[d.getDay()] : DIAS[d.getDay()] + " · " + d.getFullYear();
}

function montarRegua(){
  const n = hoje();
  const ini = new Date(n); ini.setDate(n.getDate() - n.getDay());
  const r = document.getElementById("regua");
  r.innerHTML = "";
  for (let i = 0; i < 7; i++){
    const d = new Date(ini); d.setDate(ini.getDate() + i);
    const t = MAPA[d.getDay()];
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.t = t;
    b.dataset.k = chave(d);
    const futuro = d > n, ativo = chave(d) === chave(dataAtiva);
    b.className = ativo ? "on" : (futuro ? "future" : "past");
    b.innerHTML = '<span class="d">' + DIAS[d.getDay()] + '</span><i class="tick"></i>';
    b.setAttribute("aria-label", DIAS[d.getDay()] + " " + d.getDate() + ", " + NOME[t]);
    if (!futuro) b.addEventListener("click", () => { dataAtiva = d; pintarCartao(d); montarRegua(); irPara("hoje"); });
    else b.addEventListener("click", () => aviso("Esse dia abre às 5h."));
    r.appendChild(b);
  }
}

function cartaoLista(d, opts){
  opts = opts || {};
  const {trilha, item} = selecionar(d);
  const el = document.createElement(opts.trancado ? "div" : "button");
  if (!opts.trancado) el.type = "button";
  el.className = "item" + (opts.trancado ? " trancado" : "");
  el.dataset.t = trilha;
  const meta = '<div class="m"><span>' + NOME[trilha] + '</span><span>' + DIAS[d.getDay()] + " " + String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + '</span></div>';
  if (opts.trancado){
    el.innerHTML = meta + '<p class="f">Abre às 5h</p>';
  } else {
    el.innerHTML = meta + '<p class="f"></p><div class="a"></div>';
    el.querySelector(".f").textContent = item.f;
    el.querySelector(".a").textContent = item.a;
    el.addEventListener("click", () => { dataAtiva = d; pintarCartao(d); montarRegua(); irPara("hoje"); });
  }
  return el;
}

function montarSemana(){
  const n = hoje();
  const ini = new Date(n); ini.setDate(n.getDate() - n.getDay());
  const box = document.getElementById("listaSemana");
  box.innerHTML = "";
  for (let i = 0; i < 7; i++){
    const d = new Date(ini); d.setDate(ini.getDate() + i);
    box.appendChild(cartaoLista(d, {trancado: d > n}));
  }
}

function montarSalvos(){
  const box = document.getElementById("listaSalvos");
  box.innerHTML = "";
  if (!salvos.length){
    box.innerHTML = '<p class="vazio">Nada marcado ainda.<br>Toque em Salvar quando uma mensagem valer a releitura.</p>';
    return;
  }
  salvos.slice().sort((a,b) => b.k.localeCompare(a.k)).forEach(s => {
    const p = s.k.split("-").map(Number);
    box.appendChild(cartaoLista(new Date(p[0], p[1]-1, p[2])));
  });
}

let filtroAtual = "todas";
function montarTodas(){
  const q = document.getElementById("busca").value.trim().toLowerCase();
  const box = document.getElementById("listaTodas");
  box.innerHTML = "";
  const trilhas = filtroAtual === "todas" ? ["estoico","lideranca","devocional"] : [filtroAtual];
  let n = 0;
  trilhas.forEach(t => {
    BANCO[t].forEach(item => {
      if (n >= 60) return;
      const alvo = (item.f + " " + item.a + " " + item.c + " " + (item.m || "")).toLowerCase();
      if (q && !alvo.includes(q)) return;
      n++;
      const el = document.createElement("button");
      el.type = "button";
      el.className = "item"; el.dataset.t = t;
      el.innerHTML = '<div class="m"><span>' + NOME[t] + '</span><span class="abrir">Ler</span></div><p class="f"></p><div class="a"></div><div class="corpo" hidden></div>';
      el.querySelector(".f").textContent = item.f;
      el.querySelector(".a").textContent = item.a;
      const corpo = el.querySelector(".corpo");
      el.addEventListener("click", () => {
        if (!corpo.dataset.pronto){
          (item.m || "").split(/\n\s*\n/).forEach(par => {
            const p = document.createElement("p");
            p.textContent = par.trim();
            if (p.textContent) corpo.appendChild(p);
          });
          const fim = document.createElement("p");
          fim.className = "aplicar";
          fim.textContent = "Aplicar hoje: " + item.c;
          corpo.appendChild(fim);
          corpo.dataset.pronto = "1";
        }
        corpo.hidden = !corpo.hidden;
        el.querySelector(".abrir").textContent = corpo.hidden ? "Ler" : "Fechar";
      });
      box.appendChild(el);
    });
  });
  if (!n) box.innerHTML = '<p class="vazio">Nenhuma mensagem com esse termo.</p>';
  else if (n >= 60) box.insertAdjacentHTML("beforeend", '<p class="vazio">Mostrando as 60 primeiras. Refine a busca para ver o resto.</p>');
}

function irPara(nome){
  document.querySelectorAll(".painel").forEach(p => p.classList.toggle("on", p.id === "p-" + nome));
  document.querySelectorAll('.abas button').forEach(b => b.setAttribute("aria-selected", String(b.dataset.p === nome)));
  if (nome === "semana") montarSemana();
  if (nome === "salvos") montarSalvos();
  if (nome === "todas") montarTodas();
  window.scrollTo({top:0, behavior:"instant"});
}

let tid;
function aviso(txt){
  const t = document.getElementById("toast");
  t.textContent = txt; t.classList.add("on");
  clearTimeout(tid); tid = setTimeout(() => t.classList.remove("on"), 1900);
}

document.querySelectorAll('.abas button').forEach(b => b.addEventListener("click", () => irPara(b.dataset.p)));

document.getElementById("btnSalvar").addEventListener("click", () => {
  const k = chave(dataAtiva);
  const i = salvos.findIndex(s => s.k === k);
  if (i >= 0){ salvos.splice(i,1); aviso("Removida dos salvos"); }
  else { salvos.push({k}); aviso("Salva"); }
  store.gravar("alicerce.salvos", salvos);
  pintarCartao(dataAtiva);
});

document.getElementById("btnCopiar").addEventListener("click", () => {
  const {item} = selecionar(dataAtiva);
  const txt = '"' + item.f + '"\n' + item.a + "\n\n" + (item.m || "") + "\n\nAplicar hoje: " + item.c;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => aviso("Copiada")).catch(() => aviso("Não deu para copiar"));
  else aviso("Não deu para copiar");
});

document.getElementById("busca").addEventListener("input", montarTodas);
document.getElementById("filtros").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  filtroAtual = c.dataset.f;
  document.querySelectorAll("#filtros .chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
  montarTodas();
});

document.getElementById("rodapeContagem").textContent =
  (BANCO.estoico.length + BANCO.lideranca.length + BANCO.devocional.length) + " mensagens · sem repetir até 2031";

pintarCartao(dataAtiva);
montarRegua();

/* se o app ficar aberto e o dia virar, atualiza sozinho */
setInterval(() => {
  const h = hoje();
  if (chave(h) !== chave(dataAtiva) && document.getElementById("p-hoje").classList.contains("on")){
    dataAtiva = h; pintarCartao(h); montarRegua();
  }
}, 60000);
</script>

</body>
